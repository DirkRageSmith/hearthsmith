<!doctype html>
<html lang="en" data-chrome="jrpg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151013">
<title>Character — Ragesmith</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="palette.css">
<style>
  /* Every colour token lives in palette.css. This page commits to the JRPG
     chrome (ADR-030) via <html data-chrome="jrpg"> rather than a second :root
     block — a menu window over a moving colour field is a different object
     from a cream light variant, not a theme of it. Only --r stays here. */
  :root{ --r:0px; }
  /* ---- THE BACKGROUND (ADR-030, EarthBound pass) -----------------------
     EarthBound's signature is not a sprite — it is an ALGORITHM. The battle
     backgrounds were two layers of pattern warped per scanline by the SNES's
     HDMA, drifting against each other while the palette cycled. That is a
     technique, not artwork: the specific patterns are theirs and are not
     copied here, the method belongs to the medium.

     Reproduced with two counter-drifting gradient fields and a slow hue
     rotation over the top. Pure CSS — no image, no shell file, no library.

     DELIBERATELY LOW INTENSITY behind content. EarthBound put this in BATTLE,
     which is a moment, not a state; running it at full strength behind a page
     someone opens at 2am to tick "brushed my teeth" would be hostile. The
     character sheet is the one screen that earns the loud version, because
     that is this game's equivalent of the moment you stop and look. */
  .psy{
    position:fixed; inset:0; z-index:-2; overflow:hidden;
    background:var(--bg); pointer-events:none;
  }
  .psy::before, .psy::after{
    content:""; position:absolute; inset:-40%;
    background-repeat:repeat;
    will-change:transform;
  }
  .psy::before{
    background-image:
      radial-gradient(circle at 25% 25%, var(--drift-1) 0 8%, transparent 34%),
      radial-gradient(circle at 75% 65%, var(--drift-2) 0 9%, transparent 36%),
      radial-gradient(circle at 55% 15%, var(--drift-3) 0 7%, transparent 30%);
    background-size:340px 340px, 420px 420px, 280px 280px;
    opacity:.30;
    animation:psy-a 46s linear infinite;
  }
  .psy::after{
    background-image:
      repeating-linear-gradient(58deg, color-mix(in srgb,var(--drift-stripe-1) 55%,transparent) 0 12px, transparent 12px 34px),
      repeating-linear-gradient(-49deg, color-mix(in srgb,var(--drift-stripe-2) 42%,transparent) 0 9px, transparent 9px 40px);
    opacity:.16;
    mix-blend-mode:screen;
    animation:psy-b 33s linear infinite;
  }
  .psy-tint{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    backdrop-filter:hue-rotate(0deg);
    animation:psy-hue 28s linear infinite;
  }
  @keyframes psy-a{
    0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(-90px,60px,0) scale(1.08)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes psy-b{
    0%{transform:translate3d(0,0,0)}
    100%{transform:translate3d(160px,-110px,0)}
  }
  @keyframes psy-hue{
    0%{backdrop-filter:hue-rotate(0deg)}
    100%{backdrop-filter:hue-rotate(360deg)}
  }
  /* The loud version, for the one screen that earns it. */
  .psy.psy-loud::before{opacity:.55}
  .psy.psy-loud::after{opacity:.30}

  /* Motion is the whole effect, so honouring this properly means keeping the
     COLOUR and dropping the MOVEMENT — not hiding the background, which would
     leave a different-looking app for anyone with the preference set. */
  @media (prefers-reduced-motion:reduce){
    .psy::before, .psy::after, .psy-tint{animation:none!important}
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent; color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  a{color:var(--ember);text-decoration:none}
  .back{font-size:.82rem;color:var(--dim);display:inline-block;margin-bottom:14px}

  /* ---- the crest ---------------------------------------------------------
     Five arms, one per skill, each reaching further as that tree grows. It is
     deterministic and it visibly changes as you do — which is the point of
     having one instead of choosing a portrait from a list. */
  .crest-wrap{display:flex;gap:16px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin-bottom:14px}
  .crest{width:104px;height:104px;flex:none;
    filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ember) 24%,transparent))}
  .who{min-width:0}
  .name{font-size:1.3rem;font-weight:650;letter-spacing:.2px;
        background:none;border:none;color:var(--ink);font-family:inherit;
        padding:0;width:100%;border-bottom:1px dashed transparent}
  .name:focus{outline:none;border-bottom-color:var(--line)}
  .title{color:var(--ember);font-size:.92rem;margin-top:3px}
  .standing-note{color:var(--faint);font-size:.76rem;margin-top:7px;line-height:1.5}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:10px 11px;text-align:center}
  .stat b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{color:var(--dim);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}
  .stat.e b{color:var(--ember)}

  h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
     margin:22px 0 10px;font-weight:600}

  .tree{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:12px 14px;margin-bottom:8px}
  .tree.unstarted{opacity:.62}
  .tree-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .tree-name{font-weight:600;font-size:.95rem}
  .tree-lv{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar{height:9px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
  .tree-note{font-size:.74rem;color:var(--faint);margin-top:7px}

  .row{display:flex;justify-content:space-between;gap:10px;font-size:.87rem;
       background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:10px 13px;margin-bottom:6px}
  .row span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
  .empty{color:var(--faint);font-size:.85rem;line-height:1.6;padding:10px 2px}
  footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--faint);font-size:.73rem;line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="psy psy-loud" aria-hidden="true"></div>
<div class="psy-tint" aria-hidden="true"></div>

<a class="back" href="index.html">&larr; Hearthsmith</a>

<div class="crest-wrap">
  <svg class="crest" id="crest" viewBox="0 0 100 100" aria-label="Your crest"></svg>
  <div class="who">
    <input class="name" id="name" placeholder="Name your character" maxlength="28" autocomplete="off" spellcheck="false">
    <div class="title" id="title">&nbsp;</div>
    <div class="standing-note" id="standingnote"></div>
  </div>
</div>

<div class="stats">
  <div class="stat e"><b id="s-embers">0</b><span>Embers</span></div>
  <div class="stat"><b id="s-xp">0</b><span>XP</span></div>
  <div class="stat"><b id="s-actions">0</b><span>Logged</span></div>
  <div class="stat"><b id="s-days">0</b><span>Days</span></div>
</div>

<h2>Skills</h2>
<div id="trees"></div>

<h2>Where this came from</h2>
<div id="games"></div>

<h2>Most logged</h2>
<div id="most"></div>

<footer id="foot"></footer>

<script src="ledger.js"></script>
<script src="character.js"></script>
<script>
(function () {
  "use strict";
  var L = window.Ledger, C = window.Character;
  var $ = function (id) { return document.getElementById(id); };
  var NAME_KEY = "ragesmith.character.v1";   // studio-wide, like the ledger
  var COLOR = { body:"var(--body)", home:"var(--home)", kitchen:"var(--kitchen)",
                craft:"var(--craft)", community:"var(--community)" };

  function loadName() {
    try { return (JSON.parse(localStorage.getItem(NAME_KEY) || "{}").name) || ""; }
    catch (e) { return ""; }
  }
  function saveName(n) {
    try { localStorage.setItem(NAME_KEY, JSON.stringify({ name: n })); } catch (e) {}
  }

  /* ---- the crest's colour ------------------------------------------------
   * The HUE is the character's — identity, and it stays in the data. The
   * saturation and lightness are style, and they live in palette.css so that
   * flattening the crest for a different era is one edit there rather than
   * seven here. hsl() is composed in the space-separated form so the token can
   * carry the "S L" pair whole. */
  var CREST = (function () {
    var cs = getComputedStyle(document.documentElement);
    return function (hue, token) { return "hsl(" + hue + " " + cs.getPropertyValue(token).trim() + ")"; };
  })();

  function drawCrest(crest) {
    var pts = crest.points.map(function (p) { return p.x + "," + p.y; }).join(" ");
    var svg = '<defs><radialGradient id="g"><stop offset="0%" stop-color="' +
              CREST(crest.hue, "--crest-glow-in") + '" stop-opacity=".55"/><stop offset="100%" stop-color="' +
              CREST(crest.hue, "--crest-glow-out") + '" stop-opacity=".06"/></radialGradient></defs>';
    svg += '<circle cx="50" cy="50" r="46" fill="url(#g)"/>';
    svg += '<polygon points="' + pts + '" fill="' + CREST(crest.hue, "--crest-fill") +
           '" fill-opacity=".26" stroke="' + CREST(crest.hue, "--crest-edge") +
           '" stroke-width="1.6" stroke-linejoin="round"/>';
    crest.points.forEach(function (p) {
      /* An unlit node is a tree not yet started. It is drawn hollow rather than
         missing — nothing here should read as a gap you failed to fill. */
      svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (p.lit ? 3.4 : 2.2) +
             '" fill="' + (p.lit ? CREST(p.hue, "--crest-node-lit") : 'none') +
             '" stroke="' + CREST(p.hue, "--crest-node-ring") + '" stroke-width="1.2"/>';
    });
    svg += '<circle cx="50" cy="50" r="3" fill="' + CREST(crest.hue, "--crest-core") + '"/>';
    $("crest").innerHTML = svg;
  }

  function render() {
    var events = L.read();
    var catalog = window.__catalog || null;
    var c = C.build(events, { ledger: L, catalog: catalog, name: loadName() });

    drawCrest(c.crest);
    $("name").value = c.name || "";
    $("title").textContent = c.title;

    $("standingnote").textContent = c.standing.next
      ? c.standing.toNext.toLocaleString() + " XP until " + c.standing.next
      : "Every standing earned.";

    $("s-embers").textContent  = c.embers.toLocaleString();
    $("s-xp").textContent      = c.xp.toLocaleString();
    $("s-actions").textContent = c.actions.toLocaleString();
    $("s-days").textContent    = c.daysLogged.toLocaleString();

    var trees = $("trees"); trees.innerHTML = "";
    c.skills.forEach(function (s) {
      var d = document.createElement("div");
      d.className = "tree" + (s.started ? "" : " unstarted");
      d.innerHTML =
        '<div class="tree-top"><span class="tree-name">' + s.label + '</span>' +
        '<span class="tree-lv">level ' + s.level + '</span></div>' +
        '<div class="bar"><i style="width:' + (100 * s.progress).toFixed(1) +
          '%;background:' + COLOR[s.id] + '"></i></div>' +
        '<div class="tree-note">' + (s.started
            ? s.into + ' / ' + s.need + ' to level ' + (s.level + 1)
            : 'Not started yet.') + '</div>';
      trees.appendChild(d);
    });

    /* The shared world, made visible. Every game that has ever written to this
       ledger shows up here — which is what "one character, all games" looks
       like when it is working. */
    var g = $("games"); g.innerHTML = "";
    if (!c.games.length) {
      g.innerHTML = '<div class="empty">Nothing logged yet. Anything you log in ' +
                    'Hearthsmith — or in any Ragesmith game later — becomes part of ' +
                    'this same character.</div>';
    }
    c.games.forEach(function (x) {
      var d = document.createElement("div");
      d.className = "row";
      d.innerHTML = '<span>' + x.game + '</span><span>' + x.events +
                    (x.events === 1 ? ' event' : ' events') +
                    (x.first ? ' &middot; since ' + x.first : '') + '</span>';
      g.appendChild(d);
    });

    var m = $("most"); m.innerHTML = "";
    if (!c.mostLogged.length) m.innerHTML = '<div class="empty">Nothing yet.</div>';
    c.mostLogged.forEach(function (x) {
      var d = document.createElement("div");
      d.className = "row";
      d.innerHTML = '<span>' + x.label + '</span><span>' + x.count + '&times;</span>';
      m.appendChild(d);
    });

    $("foot").innerHTML =
      (c.firstDay ? "Keeping the fire since " + c.firstDay + ".<br>" : "") +
      "This character is computed from your ledger, not stored — so it can never " +
      "disagree with what you actually did.<br>" +
      "Everything stays on this device. Schema v" + L.SCHEMA_VERSION +
      (c.unknownKinds ? " &middot; " + c.unknownKinds + " event(s) from a newer version, kept untouched." : "");
  }

  $("name").addEventListener("input", function () { saveName(this.value.trim()); });
  $("name").addEventListener("blur", render);

  fetch("catalog.json").then(function (r) { return r.json(); })
    .then(function (cat) { window.__catalog = cat; render(); })
    .catch(function () { render(); });   // the sheet works without labels

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
