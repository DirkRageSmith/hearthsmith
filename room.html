<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151013">
<title>The main room — Hearthsmith</title>
<link rel="manifest" href="manifest.json">
<style>
  /* Same palette as index.html, deliberately duplicated rather than extracted.
     Extracting it would add a stylesheet to the shell, and a shell file is a
     thing that has to be cache-busted forever. Two copies of eleven custom
     properties is the cheaper of the two debts at this size.

     NOTE: this palette themes the INTERFACE. The room itself has its own fixed
     palette in tiles.js and does not follow light/dark — a room is a place, and
     a place does not change colour because the phone did. */
  :root{
    --bg:#151013; --panel:#1e1719; --panel-2:#261d20; --line:#3a2c2f;
    --ink:#f3e9e2; --dim:#a8968f; --faint:#7b6b67;
    --ember:#ff9d4d; --ember-soft:#5a3620; --glow:#ffce8a;
    --body:#8fbf7f; --home:#7fa8d8; --kitchen:#e2a06a; --craft:#b79bd8; --community:#e08fa8;
    --r:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf5f0; --panel:#fff; --panel-2:#f3ebe4; --line:#e4d7cc;
      --ink:#2a2124; --dim:#6f5f5a; --faint:#948079; --ember-soft:#ffe6cc;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:1.35rem;margin:0;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:.85rem;margin-top:2px}
  .ghost{
    appearance:none;cursor:pointer;font:inherit;font-size:.8rem;min-height:40px;
    display:inline-flex;align-items:center;text-decoration:none;
    background:transparent;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;padding:9px 13px;
  }

  /* ---- the room ---- */
  .room{
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    background:#2b211c;margin-bottom:14px;line-height:0;
  }
  .room svg{display:block;width:100%;height:auto}
  .vacant{fill:#ffffff;fill-opacity:.045;stroke:#ffffff;stroke-opacity:.13;
          stroke-width:1;stroke-dasharray:3 3}
  .roomline{color:var(--dim);font-size:.8rem;text-align:center;padding:10px 12px;line-height:1.5}

  .bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  .stat b{display:block;font-size:1.28rem;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  .stat.embers b{color:var(--ember)}

  h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
     margin:22px 0 9px;font-weight:600}

  .items{display:grid;gap:8px}
  .row{
    display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:11px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  }
  .row .thumb{width:46px;height:46px;border-radius:9px;background:#3a2f28;display:block;padding:3px}
  .row .name{font-size:.9rem;line-height:1.3}
  .row .blurb{color:var(--faint);font-size:.76rem;line-height:1.35;margin-top:2px}
  .row .why{color:var(--dim);font-size:.74rem;margin-top:3px}
  .row.locked .thumb{opacity:.3;filter:grayscale(.8)}
  .row.locked .name{color:var(--dim)}
  .row.owned{background:var(--ember-soft);border-color:var(--ember)}

  button.buy{
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    appearance:none;cursor:pointer;font:inherit;font-size:.82rem;font-variant-numeric:tabular-nums;
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:99px;padding:10px 14px;min-height:44px;white-space:nowrap;
    transition:transform .08s ease,background .2s ease,border-color .2s ease;
  }
  button.buy:active{transform:scale(.96)}
  button.buy.ready{border-color:var(--ember);color:var(--ember)}
  button.buy.confirm{background:var(--ember);border-color:var(--ember);color:#2a1608;font-weight:700}
  button.buy[disabled]{opacity:.5;cursor:default}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--faint);font-size:.74rem;line-height:1.7}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
  .warn{background:var(--ember-soft);border:1px solid var(--ember);border-radius:var(--r);
        padding:13px 15px;margin-bottom:14px;font-size:.85rem;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="boot" class="warn" hidden></div>

<header>
  <div>
    <h1 id="roomtitle">The main room</h1>
    <div class="sub" id="roomsub">&nbsp;</div>
  </div>
  <a class="ghost" href="index.html">back</a>
</header>

<div class="room">
  <svg id="roomsvg" role="img" aria-labelledby="roomdesc" preserveAspectRatio="xMidYMid meet">
    <title id="roomdesc">Your room</title>
    <defs id="roomdefs"></defs>
    <g id="scene"></g>
  </svg>
  <div class="roomline" id="roomline">&nbsp;</div>
</div>

<div class="bal">
  <div class="stat embers"><b id="embers">0</b><span>Embers to spend</span></div>
  <div class="stat"><b id="ownedn">0</b><span>Built so far</span></div>
</div>

<div id="shop"></div>

<footer id="foot"></footer>

<script src="ledger.js"></script>
<script src="character.js"></script>
<script src="tiles.js"></script>
<script src="shop.js"></script>
<script>
(function () {
  "use strict";
  var L = window.Ledger, C = window.Character, S = window.Shop, T = window.Tiles;
  var SHOP = null, CUR = null, IDS = null;
  var arming = null, armTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";

  var SKILL_LABEL = { body:"Body", home:"Home", kitchen:"Kitchen", craft:"Craft", community:"Community" };
  var ORDER = ["home", "body", "kitchen", "craft", "community"];

  Promise.all([
    fetch("shop.json").then(function (r) { return r.json(); }),
    fetch("currencies.json").then(function (r) { return r.json(); })
  ]).then(function (both) {
    SHOP = both[0]; CUR = both[1]; IDS = L.currencyIdSet(CUR);
    buildDefs();
    render();
  }).catch(function () {
    var b = $("boot"); b.hidden = false;
    b.innerHTML = "<b>Serve this folder over http to run it.</b><br>" +
      "Opening <code>room.html</code> off the file system blocks loading " +
      "<code>shop.json</code>. Run <code>python -m http.server 8080</code> here.";
  });

  /* ---- the tileset, installed once -------------------------------------
     Every sprite becomes a <symbol>, so the room and the shop thumbnails share
     one definition. The wall and floor are <pattern>s rather than a few hundred
     <use> elements: a 16x10 room would be 160 nodes redrawn on every purchase,
     and a pattern is two. */
  function buildDefs() {
    var tile = SHOP.room.tile;
    var d = $("roomdefs");
    d.innerHTML =
      T.defs() +
      '<pattern id="p-wall" width="' + tile + '" height="' + tile + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-wall" width="' + tile + '" height="' + tile + '"/></pattern>' +
      '<pattern id="p-wainscot" width="' + tile + '" height="' + tile + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-wainscot" width="' + tile + '" height="' + tile + '"/></pattern>' +
      /* Two board variants staggered over a 2x2 cell, so a wide floor does not
         show an obvious repeat every sixteen pixels. */
      '<pattern id="p-floor" width="' + (tile * 2) + '" height="' + (tile * 2) + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-floor_a" x="0" y="0" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_b" x="' + tile + '" y="0" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_b" x="0" y="' + tile + '" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_a" x="' + tile + '" y="' + tile + '" width="' + tile + '" height="' + tile + '"/>' +
      '</pattern>' +
      /* The hearth light. Its reach is driven by the ledger, never by a clock or
         a timer — see warmth(). It only ever adds light; there is no state in
         which the room gets darker than it was. */
      '<radialGradient id="g-hearth" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#ff9d4d" stop-opacity=".30"/>' +
        '<stop offset="45%" stop-color="#ff9d4d" stop-opacity=".10"/>' +
        '<stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>' +
      '</radialGradient>' +
      /* Corners fall away slightly. Pure decoration, and it is what stops a flat
         tiled field from reading as wallpaper instead of a room. */
      '<radialGradient id="g-vignette" cx="50%" cy="46%" r="75%">' +
        '<stop offset="66%" stop-color="#000000" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#000000" stop-opacity=".26"/>' +
      '</radialGradient>';
  }

  /* ---- warmth ----------------------------------------------------------
     Lifted from index.html's hearth, and the same rules apply: it rises with
     recent activity and settles toward a FLOOR that rises permanently with
     total XP. It never reaches zero, so the worst the room ever looks after
     months of use is better than the best it looked in week one. It is not a
     currency, it buys nothing, and it gates nothing. */
  function warmth(events, totals) {
    var now = Date.now(), recent = 0;
    events.forEach(function (e) {
      if (!e.ts) return;
      var age = (now - new Date(e.ts).getTime()) / 86400000;
      if (age >= 0 && age < 3) recent += (1 - age / 3);
    });
    var floor = Math.min(0.42, Math.log10(1 + (totals["core:xp"] || 0) / 100) * 0.30);
    return Math.max(floor, Math.min(1, floor + recent / 7));
  }

  /* ---- the room drawing ------------------------------------------------- */
  function el(name, attrs) {
    var n = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  function drawRoom(events, totals) {
    var room = SHOP.room, tile = room.tile;
    var W = room.cols * tile, H = room.rows * tile;
    var wallH = room.wainscot_row * tile;          // plaster band
    var floorY = room.wall_rows * tile;

    var svg = $("roomsvg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var g = $("scene");
    while (g.firstChild) g.removeChild(g.firstChild);

    g.appendChild(el("rect", { x:0, y:0, width:W, height:wallH, fill:"url(#p-wall)" }));
    g.appendChild(el("rect", { x:0, y:wallH, width:W, height:tile, fill:"url(#p-wainscot)" }));
    g.appendChild(el("rect", { x:0, y:floorY, width:W, height:H - floorY, fill:"url(#p-floor)" }));

    /* Empty floor cells, faintly. "There is room for more", never "you have
       nothing" — the same reason a locked item stays visible in the shop. */
    S.vacantCells(events, SHOP).forEach(function (v) {
      g.appendChild(el("rect", {
        x: v.cell[0] * tile + 2, y: v.cell[1] * tile + 2,
        width: v.size[0] * tile - 4, height: v.size[1] * tile - 4,
        rx: 3, "class": "vacant"
      }));
    });

    /* Already in draw order: rugs, then wall, then floor back-to-front. */
    var here = S.placed(events, SHOP);
    here.forEach(function (p) {
      var it = p.item, c = it.cell, s = it.size;
      if (it.layer === "floor") {
        /* A soft contact shadow. Without one, furniture floats and the room
           reads as a sticker sheet rather than as a place. */
        g.appendChild(el("ellipse", {
          cx: (c[0] + s[0] / 2) * tile, cy: (c[1] + s[1]) * tile - 2,
          rx: s[0] * tile * 0.40, ry: tile * 0.17,
          fill: "#000000", "fill-opacity": ".22"
        }));
      }
      var u = el("use", {
        href: "#t-" + it.sprite,
        x: c[0] * tile, y: c[1] * tile,
        width: s[0] * tile, height: s[1] * tile
      });
      var title = document.createElementNS(NS, "title");
      title.textContent = it.label || it.id;
      u.appendChild(title);
      g.appendChild(u);
    });

    var w = warmth(events, totals);
    var fire = (room.fixtures || [])[0];
    if (fire) {
      var fx = (fire.cell[0] + fire.size[0] / 2) * tile;
      var fy = (fire.cell[1] + fire.size[1] / 2) * tile;
      var reach = tile * (4 + w * 6);
      g.appendChild(el("ellipse", {
        cx: fx, cy: fy, rx: reach, ry: reach * 0.72,
        fill: "url(#g-hearth)", opacity: (0.30 + w * 0.55).toFixed(3),
        "pointer-events": "none"
      }));
    }
    g.appendChild(el("rect", {
      x:0, y:0, width:W, height:H, fill:"url(#g-vignette)", "pointer-events":"none"
    }));

    var built = here.filter(function (p) { return !p.fixture; }).length;
    $("roomline").textContent = built === 0
      ? "The hearth is lit and the room is otherwise bare. Everything here is bought with Embers you already earned."
      : built === 1
        ? "The hearth, and one thing you built."
        : "The hearth, and " + built + " things you built.";
    return built;
  }

  /* ---- buying ----------------------------------------------------------
     TWO TAPS, ALWAYS. Nothing built is ever taken back (§4 rule 2), which is a
     kindness in every case except one: a mis-tap that spends three weeks of
     Embers cannot be undone by the retraction mechanism either, because
     retraction corrects *what you did*, not what you chose to buy. So the
     confirmation is the only guard this action gets, and it is not optional.
     It disarms itself after a few seconds so it never sits waiting to be
     brushed. */
  function arm(item, btn) {
    if (arming === item.id) { commit(item); return; }
    disarm();
    arming = item.id;
    btn.classList.add("confirm");
    btn.textContent = "buy for " + item.cost["core:embers"].toLocaleString() + "?";
    armTimer = setTimeout(function () { disarm(); render(); }, 4500);
  }
  function disarm() {
    arming = null;
    if (armTimer) { clearTimeout(armTimer); armTimer = null; }
  }
  function commit(item) {
    disarm();
    var events = L.read();
    var verdict = S.canBuy(events, item, { ledger: L, character: C });
    if (!verdict.ok) { render(); return; }   // re-checked against the ledger, not the UI
    var ev = S.buyEvent(L, item);
    var errs = L.validate(ev, IDS);
    if (errs.length) { alert("Not bought — " + errs.join("; ")); return; }
    L.appendAndSave(ev, IDS);
    render();
  }

  /* ---- render ----------------------------------------------------------- */
  function render() {
    var events = L.read();
    var totals = L.balances(events);
    var rows = S.view(events, SHOP, { ledger: L, character: C });
    var have = Math.round(totals["core:embers"] || 0);

    $("roomtitle").textContent = SHOP.room.label;
    $("embers").textContent = have.toLocaleString();
    $("ownedn").textContent = rows.filter(function (r) { return r.owned; }).length;
    $("roomsub").textContent = "yours, and nothing in it can ever be taken back";

    drawRoom(events, totals);

    var wrap = $("shop"); wrap.innerHTML = "";
    ORDER.forEach(function (skill) {
      var mine = rows.filter(function (r) { return r.item.skill === skill; });
      if (!mine.length) return;
      var owned = mine.filter(function (r) { return r.owned; }).length;
      var h = document.createElement("h2");
      h.textContent = SKILL_LABEL[skill] + " · level " + mine[0].level +
                      " · " + owned + " of " + mine.length;
      wrap.appendChild(h);
      var list = document.createElement("div"); list.className = "items";
      mine.forEach(function (r) { list.appendChild(rowFor(r)); });
      wrap.appendChild(list);
    });

    var unknown = L.countUnknownKinds(events);
    $("foot").innerHTML =
      "What you own is worked out from your own spend events — there is no separate " +
      "list of your things anywhere, so an export carries the whole room with it." +
      (unknown ? "<br>" + unknown + " event(s) were written by a newer version and are kept untouched." : "") +
      "<br>Schema v" + L.SCHEMA_VERSION + " &middot; " + L.SOURCE;
  }

  function rowFor(r) {
    var el2 = document.createElement("div");
    el2.className = "row" + (r.owned ? " owned" : r.unlocked ? "" : " locked");

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "thumb");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.appendChild(el("use", { href: "#t-" + r.item.sprite, width: 16, height: 16 }));
    el2.appendChild(svg);

    var mid = document.createElement("div");
    var why = r.owned ? "yours"
      : !r.unlocked ? SKILL_LABEL[r.item.skill] + " level " + r.item.unlock_level + " unlocks it"
      : !r.affordable ? r.shortBy.toLocaleString() + " more Embers"
      : "";
    mid.innerHTML = '<div class="name">' + esc(r.item.label) + '</div>' +
                    '<div class="blurb">' + esc(r.item.blurb || "") + '</div>' +
                    (why ? '<div class="why">' + esc(why) + '</div>' : '');
    el2.appendChild(mid);

    var right = document.createElement("div");
    var b = document.createElement("button");
    b.className = "buy" + (r.can.ok ? " ready" : "");
    b.type = "button";
    if (r.owned) { b.textContent = "built"; b.disabled = true; }
    else {
      b.textContent = r.item.cost["core:embers"].toLocaleString() + " ◆";
      b.disabled = !r.can.ok;
      if (r.can.ok) b.addEventListener("click", function () { arm(r.item, b); });
    }
    right.appendChild(b);
    el2.appendChild(right);
    return el2;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
