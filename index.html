<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151013">
<title>Hearthsmith</title>
<link rel="manifest" href="manifest.json">
<style>
  /* Dark first, on purpose: this gets opened at night, in bed, at low screen
     brightness. Warm hues rather than blue-grey — the hearth is the metaphor and
     the interface should feel like it is on the same side as you. */
  :root{
    --bg:#151013; --panel:#1e1719; --panel-2:#261d20; --line:#3a2c2f;
    --ink:#f3e9e2; --dim:#a8968f; --faint:#7b6b67;
    --ember:#ff9d4d; --ember-soft:#5a3620; --glow:#ffce8a;
    --body:#8fbf7f; --home:#7fa8d8; --kitchen:#e2a06a; --craft:#b79bd8; --community:#e08fa8;
    --r:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf5f0; --panel:#fff; --panel-2:#f3ebe4; --line:#e4d7cc;
      --ink:#2a2124; --dim:#6f5f5a; --faint:#948079; --ember-soft:#ffe6cc;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  h1{font-size:1.35rem;margin:0;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:.85rem;margin-top:2px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}

  /* The hearth. Warmth reflects recent activity and settles toward a floor that
     rises permanently with total XP — it never goes out, and it is never a
     currency. It buys nothing and gates nothing. It is only ever a mirror. */
  .hearth{
    position:relative;border-radius:var(--r);padding:18px 16px;margin-bottom:14px;
    background:radial-gradient(120% 90% at 50% 115%,
      color-mix(in srgb,var(--ember) calc(var(--warm) * 26%),transparent) 0%,
      var(--panel) 62%);
    border:1px solid var(--line); overflow:hidden;
  }
  .flame{
    width:100%;height:56px;display:block;
    filter:drop-shadow(0 0 calc(2px + var(--warm)*14px) rgba(255,157,77,calc(.10 + var(--warm)*.42)));
  }
  .hearth-label{text-align:center;color:var(--dim);font-size:.78rem;margin-top:6px}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  .stat b{display:block;font-size:1.28rem;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  .stat.embers b{color:var(--ember)}

  .skills{display:grid;gap:9px;margin-bottom:20px}
  .skill{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;font-size:.85rem}
  .bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1)}
  .lvl{color:var(--dim);font-size:.78rem;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}

  h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
     margin:20px 0 9px;font-weight:600}
  .group{display:flex;flex-wrap:wrap;gap:7px}
  button.act{
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    appearance:none;cursor:pointer;font:inherit;font-size:.88rem;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:99px;padding:11px 15px;min-height:44px; /* thumb-sized, always */
    transition:transform .08s ease, background .2s ease, border-color .2s ease;
  }
  button.act:active{transform:scale(.96)}
  button.act:hover{border-color:var(--ember)}
  button.act .tick{color:var(--ember);font-weight:700}
  button.act.done{background:var(--ember-soft);border-color:var(--ember)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
  button.ghost{
    appearance:none;cursor:pointer;font:inherit;font-size:.8rem;min-height:40px;
    background:transparent;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;padding:9px 13px;
  }
  button.ghost[aria-pressed="true"]{color:var(--ember);border-color:var(--ember)}

  .log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
  .log li{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;
          background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .log time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:.78rem}
  .empty{color:var(--faint);font-size:.87rem;padding:14px 2px;line-height:1.6}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--faint);font-size:.74rem;line-height:1.7}
  .warn{background:var(--ember-soft);border:1px solid var(--ember);border-radius:var(--r);
        padding:13px 15px;margin-bottom:14px;font-size:.85rem;color:var(--ink)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="boot" class="warn" hidden></div>

<header>
  <div>
    <h1>Hearthsmith</h1>
    <div class="sub" id="daysline">&nbsp;</div>
  </div>
</header>

<div class="hearth" id="hearth" style="--warm:0">
  <svg class="flame" viewBox="0 0 120 60" aria-hidden="true">
    <path id="flamepath" fill="var(--ember)" opacity="0.95"
      d="M60 8 C68 22 78 26 78 38 A18 18 0 0 1 42 38 C42 26 52 22 60 8 Z"/>
    <path fill="var(--glow)" opacity="0.85"
      d="M60 24 C64 32 68 34 68 40 A8 8 0 0 1 52 40 C52 34 56 32 60 24 Z"/>
  </svg>
  <div class="hearth-label" id="hearthlabel">the hearth is banked</div>
</div>

<div class="stats">
  <div class="stat embers"><b id="embers">0</b><span>Embers</span></div>
  <div class="stat"><b id="xp">0</b><span>XP</span></div>
  <div class="stat"><b id="today">0</b><span>Today</span></div>
</div>

<div class="skills" id="skills"></div>

<div id="catalog"></div>

<div class="toolbar">
  <button class="ghost" id="btn-day" aria-pressed="false" title="Logging for yesterday is allowed — forgetting to open an app is not a moral failure">for yesterday</button>
  <a class="ghost" href="profile.html" style="text-decoration:none;display:inline-flex;align-items:center">character</a>
  <button class="ghost" id="btn-export">export my data</button>
</div>

<h2>Logged</h2>
<ul class="log" id="log"></ul>

<footer id="foot"></footer>

<script src="ledger.js"></script>
<script>
(function () {
  "use strict";
  var L = window.Ledger, CAT = null, CUR = null, IDS = null;
  var backfill = false;
  var $ = function (id) { return document.getElementById(id); };

  var SKILL_COLOR = { body:"var(--body)", home:"var(--home)", kitchen:"var(--kitchen)",
                      craft:"var(--craft)", community:"var(--community)" };
  var SKILL_LABEL = { body:"Body", home:"Home", kitchen:"Kitchen", craft:"Craft", community:"Community" };

  function boot(msg) { var b = $("boot"); b.hidden = false; b.innerHTML = msg; }

  Promise.all([
    fetch("catalog.json").then(function (r) { return r.json(); }),
    fetch("currencies.json").then(function (r) { return r.json(); })
  ]).then(function (both) {
    CAT = both[0]; CUR = both[1]; IDS = L.currencyIdSet(CUR);
    render();
  }).catch(function () {
    /* Opened straight off the disk. Say what to do rather than showing a blank
       page — a silent failure here reads as "the app is broken". */
    boot("<b>Serve this folder over http to run it.</b><br>" +
         "Opening <code>index.html</code> from the file system blocks loading " +
         "<code>catalog.json</code>. From this folder run " +
         "<code>python -m http.server 8080</code> then open " +
         "<code>http://localhost:8080</code>.");
  });

  /* ---- logging ------------------------------------------------------- */

  function grantsFor(action) {
    var tier = CAT.tiers[action.tier];
    var g = {};
    Object.keys(tier.grants).forEach(function (k) { g[k] = tier.grants[k]; });
    g["skill:" + action.skill] = tier.skill_points;
    return g;
  }

  function log(action) {
    var ts = L.nowIso();
    if (backfill) {
      var d = new Date(); d.setDate(d.getDate() - 1);
      ts = L.nowIso(d);
    }
    var ev = L.newEvent({
      verb: action.verb, skill: action.skill, ts: ts,
      grants: grantsFor(action),
      meta: backfill ? { backfilled: true } : {}
    });
    var errs = L.validate(ev, IDS);
    if (errs.length) { alert("Not logged — " + errs.join("; ")); return; }
    L.appendAndSave(ev, IDS);
    render();
  }

  /* ---- warmth ---------------------------------------------------------
     Rises with recent activity, settles toward a FLOOR that rises permanently
     with total XP. It never reaches zero, so the worst the hearth ever looks
     after months of use is better than the best it looked in week one. */
  function warmth(events, totals) {
    var now = Date.now(), recent = 0;
    events.forEach(function (e) {
      if (!e.ts) return;
      var age = (now - new Date(e.ts).getTime()) / 86400000;
      if (age >= 0 && age < 3) recent += (1 - age / 3);
    });
    var floor = Math.min(0.42, Math.log10(1 + (totals["core:xp"] || 0) / 100) * 0.30);
    return Math.max(floor, Math.min(1, floor + recent / 7));
  }

  /* ---- render ---------------------------------------------------------- */

  function render() {
    var events = L.read();
    var totals = L.balances(events);
    var todayKey = L.localDayKey(L.nowIso());
    var todays = L.eventsOn(events, todayKey);

    $("embers").textContent = Math.round(totals["core:embers"] || 0).toLocaleString();
    $("xp").textContent = Math.round(totals["core:xp"] || 0).toLocaleString();
    $("today").textContent = todays.length;

    /* "12 days this month", never a streak with a reset. A broken streak is a
       punishment for having a life (ADR-006). */
    var month = L.nowIso().slice(0, 7), days = {};
    events.forEach(function (e) { if (e.ts && e.ts.slice(0,7) === month) days[L.localDayKey(e.ts)] = 1; });
    var n = Object.keys(days).length;
    $("daysline").textContent = n === 0 ? "nothing logged yet this month"
      : n + (n === 1 ? " day" : " days") + " logged this month";

    var w = warmth(events, totals);
    $("hearth").style.setProperty("--warm", w.toFixed(3));
    $("hearthlabel").textContent =
      w > 0.72 ? "the hearth is burning bright" :
      w > 0.45 ? "the hearth is warm" :
      w > 0.20 ? "the hearth is glowing" : "the hearth is banked";

    // skills
    var sk = $("skills"); sk.innerHTML = "";
    ["body","home","kitchen","craft","community"].forEach(function (s) {
      var pts = totals["skill:" + s] || 0, lv = L.levelFor(pts);
      var row = document.createElement("div"); row.className = "skill";
      row.innerHTML =
        '<span>' + SKILL_LABEL[s] + '</span>' +
        '<span class="bar"><i style="width:' + (100 * lv.into / lv.need).toFixed(1) +
          '%;background:' + SKILL_COLOR[s] + '"></i></span>' +
        '<span class="lvl">lv ' + lv.level + '</span>';
      sk.appendChild(row);
    });

    // catalogue, grouped by skill
    var wrap = $("catalog"); wrap.innerHTML = "";
    var doneToday = {};
    todays.forEach(function (e) { doneToday[e.verb] = (doneToday[e.verb] || 0) + 1; });
    ["body","home","kitchen","craft","community"].forEach(function (s) {
      var acts = CAT.actions.filter(function (a) { return a.skill === s && !a.retired; });
      if (!acts.length) return;
      var h = document.createElement("h2"); h.textContent = SKILL_LABEL[s]; wrap.appendChild(h);
      var g = document.createElement("div"); g.className = "group";
      acts.forEach(function (a) {
        var b = document.createElement("button");
        b.className = "act" + (doneToday[a.verb] ? " done" : "");
        b.type = "button";
        b.innerHTML = a.label + (doneToday[a.verb]
          ? ' <span class="tick">&times;' + doneToday[a.verb] + '</span>' : '');
        b.addEventListener("click", function () { log(a); });
        g.appendChild(b);
      });
      wrap.appendChild(g);
    });

    // log
    var ul = $("log"); ul.innerHTML = "";
    var recent = events.slice(-12).reverse();
    if (!recent.length) {
      ul.innerHTML = '<li class="empty">Nothing here yet. Tap anything above that you already did today — ' +
                     'including getting out of bed.</li>';
    }
    var byVerb = {}; CAT.actions.forEach(function (a) { byVerb[a.verb] = a.label; });
    recent.forEach(function (e) {
      var li = document.createElement("li");
      li.innerHTML = '<span>' + (byVerb[e.verb] || e.verb || e.kind) + '</span>' +
                     '<time>' + String(e.ts).slice(11,16) +
                     (L.localDayKey(e.ts) === todayKey ? '' : ' &middot; ' + String(e.ts).slice(5,10)) +
                     '</time>';
      ul.appendChild(li);
    });

    var unknown = L.countUnknownKinds(events);
    $("foot").innerHTML =
      "Everything is stored on this device only. Nothing is uploaded, and there is no account." +
      (unknown ? "<br>" + unknown + " event(s) were written by a newer version and are kept untouched." : "") +
      "<br>Schema v" + L.SCHEMA_VERSION + " &middot; " + L.SOURCE;
  }

  /* ---- toolbar --------------------------------------------------------- */

  $("btn-day").addEventListener("click", function () {
    backfill = !backfill;
    this.setAttribute("aria-pressed", String(backfill));
    this.textContent = backfill ? "logging for yesterday" : "for yesterday";
  });

  /* Export ships in the first release, non-negotiably (ADR-005). This is a
     record of someone's medication, eating and sleep held by a one-person
     studio; they must never be trapped in it. */
  $("btn-export").addEventListener("click", function () {
    var blob = new Blob([L.serialize(L.read())], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hearthsmith-ledger-" + L.localDayKey(L.nowIso()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
