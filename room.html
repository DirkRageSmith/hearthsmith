<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151013">
<title>The main room — Hearthsmith</title>
<link rel="manifest" href="manifest.json">
<style>
  /* Same palette as index.html, deliberately duplicated rather than extracted.
     Extracting it would add a stylesheet to the shell, and a shell file is a
     thing that has to be cache-busted forever. Two copies of eleven custom
     properties is the cheaper of the two debts at this size.

     NOTE: this palette themes the INTERFACE. The room itself has its own fixed
     palette in tiles.js and does not follow light/dark — a room is a place, and
     a place does not change colour because the phone did. */
  :root{
    --bg:#151013; --panel:#1e1719; --panel-2:#261d20; --line:#3a2c2f;
    --ink:#f3e9e2; --dim:#a8968f; --faint:#7b6b67;
    --ember:#ff9d4d; --ember-soft:#5a3620; --glow:#ffce8a;
    --body:#8fbf7f; --home:#7fa8d8; --kitchen:#e2a06a; --craft:#b79bd8; --community:#e08fa8;
    --r:0px;
    /* ---- 16-bit JRPG chrome (ADR-030) ----------------------------------
       Matt's direction, 2026-09-02: Super Mario RPG / EarthBound / Final
       Fantasy Mystic Quest. The window frame is the most recognisable thing
       those three share AND the safest to evoke — a thick-bordered menu box
       is genre convention going back to Dragon Quest, not any one game's
       expression. What is off limits is their characters, sprites, music,
       logos and names, none of which appear anywhere in this project.

       Three layers, and all three matter: a plum outline (never black), a
       gold bevel inside it, then the dark interior. Square corners — the 14px
       radius this replaced is a 2015 app idiom and was quietly fighting
       everything else on the page. */
    --frame-ink:#2d1b33;
    --frame-trim:#f5c542;
    --frame-fill:#241a2e;
    --frame-fill-2:#2f2239;
  }
  /* THIS PAGE DOES NOT FOLLOW THE OS THEME, and that is now a decision rather
     than an oversight. The room already refused to (a room is a place, and a
     place does not change colour because the phone did); once the chrome became
     a JRPG menu the same argument covers the whole page — a menu box is a dark
     window with gold trim, and a cream one is a different object.

     It also removes a real bug rather than a merely aesthetic mismatch: the
     shop rows now sit on the dark frame fill, so a light-mode `--ink` would
     have painted dark text on a dark panel and made the whole catalogue
     unreadable. Committing is cheaper and truer than threading two palettes
     through a frame that only works in one of them. */
  :root{
    --bg:#141019; --panel:#241a2e; --panel-2:#2f2239; --line:#3d2c4a;
    --ink:#f6ecdc; --dim:#b3a2b8; --faint:#8b7f9a;
  }
  /* ---- THE BACKGROUND (ADR-030, EarthBound pass) -----------------------
     EarthBound's signature is not a sprite — it is an ALGORITHM. The battle
     backgrounds were two layers of pattern warped per scanline by the SNES's
     HDMA, drifting against each other while the palette cycled. That is a
     technique, not artwork: the specific patterns are theirs and are not
     copied here, the method belongs to the medium.

     Reproduced with two counter-drifting gradient fields and a slow hue
     rotation over the top. Pure CSS — no image, no shell file, no library.

     DELIBERATELY LOW INTENSITY behind content. EarthBound put this in BATTLE,
     which is a moment, not a state; running it at full strength behind a page
     someone opens at 2am to tick "brushed my teeth" would be hostile. The
     character sheet is the one screen that earns the loud version, because
     that is this game's equivalent of the moment you stop and look. */
  .psy{
    position:fixed; inset:0; z-index:-2; overflow:hidden;
    background:#141019; pointer-events:none;
  }
  .psy::before, .psy::after{
    content:""; position:absolute; inset:-40%;
    background-repeat:repeat;
    will-change:transform;
  }
  .psy::before{
    background-image:
      radial-gradient(circle at 25% 25%, #ff4f9a 0 8%, transparent 34%),
      radial-gradient(circle at 75% 65%, #2fd8c8 0 9%, transparent 36%),
      radial-gradient(circle at 55% 15%, #7a5cff 0 7%, transparent 30%);
    background-size:340px 340px, 420px 420px, 280px 280px;
    opacity:.30;
    animation:psy-a 46s linear infinite;
  }
  .psy::after{
    background-image:
      repeating-linear-gradient(58deg, rgba(255,214,74,.55) 0 12px, transparent 12px 34px),
      repeating-linear-gradient(-49deg, rgba(94,214,255,.42) 0 9px, transparent 9px 40px);
    opacity:.16;
    mix-blend-mode:screen;
    animation:psy-b 33s linear infinite;
  }
  .psy-tint{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    backdrop-filter:hue-rotate(0deg);
    animation:psy-hue 28s linear infinite;
  }
  @keyframes psy-a{
    0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(-90px,60px,0) scale(1.08)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes psy-b{
    0%{transform:translate3d(0,0,0)}
    100%{transform:translate3d(160px,-110px,0)}
  }
  @keyframes psy-hue{
    0%{backdrop-filter:hue-rotate(0deg)}
    100%{backdrop-filter:hue-rotate(360deg)}
  }
  /* The loud version, for the one screen that earns it. */
  .psy.psy-loud::before{opacity:.55}
  .psy.psy-loud::after{opacity:.30}

  /* Motion is the whole effect, so honouring this properly means keeping the
     COLOUR and dropping the MOVEMENT — not hiding the background, which would
     leave a different-looking app for anyone with the preference set. */
  @media (prefers-reduced-motion:reduce){
    .psy::before, .psy::after, .psy-tint{animation:none!important}
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent; color:var(--ink);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:1.35rem;margin:0;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:.85rem;margin-top:2px}
  .ghost{
    appearance:none;cursor:pointer;font:inherit;font-size:.8rem;min-height:40px;
    display:inline-flex;align-items:center;text-decoration:none;
    background:var(--panel);color:var(--ink);border:2px solid var(--frame-ink);
    box-shadow:inset 0 0 0 1px rgba(245,197,66,.35);
    border-radius:0;padding:9px 13px;
  }

  /* ---- the room ---- */
  /* The frame. Layered inset shadows rather than nested elements, so it stays
     crisp at any size and costs no extra DOM. */
  .frame{
    background:var(--frame-fill);
    border:3px solid var(--frame-ink);
    box-shadow:inset 0 0 0 2px var(--frame-trim), inset 0 0 0 5px var(--frame-ink);
    border-radius:0;
  }
  .room{
    border:3px solid var(--frame-ink);
    box-shadow:inset 0 0 0 2px var(--frame-trim), inset 0 0 0 5px var(--frame-ink);
    border-radius:0;overflow:hidden;
    background:#2b211c;margin-bottom:14px;line-height:0;
  }
  .room svg{display:block;width:100%;height:auto}
  .vacant{fill:#ffffff;fill-opacity:.045;stroke:#ffffff;stroke-opacity:.13;
          stroke-width:1;stroke-dasharray:3 3}
  .roomline{color:var(--dim);font-size:.8rem;text-align:center;padding:10px 12px;line-height:1.5}
  .roomline b{color:var(--frame-trim);font-weight:600}

  .bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .stat{background:var(--frame-fill);border:3px solid var(--frame-ink);
        box-shadow:inset 0 0 0 2px var(--frame-trim), inset 0 0 0 5px var(--frame-ink);
        border-radius:0;padding:12px 14px}
  .stat b{display:block;font-size:1.28rem;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  .stat.embers b{color:var(--ember)}

  h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
     margin:22px 0 9px;font-weight:600}

  .items{display:grid;gap:8px}
  .row{
    display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:11px;
    background:var(--frame-fill);border:2px solid var(--frame-ink);
    box-shadow:inset 0 0 0 1px rgba(245,197,66,.35);
    border-radius:0;padding:11px 13px;
  }
  .row .thumb{width:46px;height:46px;border-radius:0;background:#1d1526;display:block;padding:3px;
            border:2px solid var(--frame-ink)}
  .row .name{font-size:.9rem;line-height:1.3}
  .row .blurb{color:var(--faint);font-size:.76rem;line-height:1.35;margin-top:2px}
  .row .why{color:var(--dim);font-size:.74rem;margin-top:3px}
  .row.locked .thumb{opacity:.3;filter:grayscale(.8)}
  .row.locked .name{color:var(--dim)}
  .row.owned{background:var(--ember-soft);border-color:var(--ember)}

  button.buy{
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    appearance:none;cursor:pointer;font:inherit;font-size:.82rem;font-variant-numeric:tabular-nums;
    background:var(--panel-2);color:var(--ink);
    border-radius:0;border:2px solid var(--frame-ink);padding:10px 14px;min-height:44px;white-space:nowrap;
    transition:transform .08s ease,background .2s ease,border-color .2s ease;
  }
  button.buy:active{transform:scale(.96)}
  button.buy.ready{border-color:var(--ember);color:var(--ember)}
  button.buy.confirm{background:var(--ember);border-color:var(--ember);color:#2a1608;font-weight:700}
  button.buy[disabled]{opacity:.5;cursor:default}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--faint);font-size:.74rem;line-height:1.7}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
  .warn{background:var(--ember-soft);border:1px solid var(--ember);border-radius:var(--r);
        padding:13px 15px;margin-bottom:14px;font-size:.85rem;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="psy" aria-hidden="true"></div>
<div class="psy-tint" aria-hidden="true"></div>

<div id="boot" class="warn" hidden></div>

<header>
  <div>
    <h1 id="roomtitle">The main room</h1>
    <div class="sub" id="roomsub">&nbsp;</div>
  </div>
  <a class="ghost" href="index.html">back</a>
</header>

<div class="room">
  <svg id="roomsvg" role="img" aria-labelledby="roomdesc" preserveAspectRatio="xMidYMid meet">
    <title id="roomdesc">Your room</title>
    <defs id="roomdefs"></defs>
    <g id="scene"></g>
  </svg>
  <div class="roomline" id="roomline">&nbsp;</div>
</div>

<div class="bal">
  <div class="stat embers"><b id="embers">0</b><span>Embers to spend</span></div>
  <div class="stat"><b id="ownedn">0</b><span>Built so far</span></div>
</div>

<div id="shop"></div>

<footer id="foot"></footer>

<script src="ledger.js"></script>
<script src="character.js"></script>
<script src="tiles.js"></script>
<script src="shop.js"></script>
<script>
(function () {
  "use strict";
  var L = window.Ledger, C = window.Character, S = window.Shop, T = window.Tiles;
  var SHOP = null, CUR = null, IDS = null;
  var arming = null, armTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";

  var SKILL_LABEL = { body:"Body", home:"Home", kitchen:"Kitchen", craft:"Craft", community:"Community" };
  var ORDER = ["home", "body", "kitchen", "craft", "community"];

  Promise.all([
    fetch("shop.json").then(function (r) { return r.json(); }),
    fetch("currencies.json").then(function (r) { return r.json(); })
  ]).then(function (both) {
    SHOP = both[0]; CUR = both[1]; IDS = L.currencyIdSet(CUR);
    buildDefs();
    render();
    bindControls();
  }).catch(function () {
    var b = $("boot"); b.hidden = false;
    b.innerHTML = "<b>Serve this folder over http to run it.</b><br>" +
      "Opening <code>room.html</code> off the file system blocks loading " +
      "<code>shop.json</code>. Run <code>python -m http.server 8080</code> here.";
  });

  /* ---- the tileset, installed once -------------------------------------
     Every sprite becomes a <symbol>, so the room and the shop thumbnails share
     one definition. The wall and floor are <pattern>s rather than a few hundred
     <use> elements: a 16x10 room would be 160 nodes redrawn on every purchase,
     and a pattern is two. */
  function buildDefs() {
    var tile = SHOP.room.tile;
    var d = $("roomdefs");
    d.innerHTML =
      T.defs() +
      '<pattern id="p-wall" width="' + tile + '" height="' + tile + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-wall" width="' + tile + '" height="' + tile + '"/></pattern>' +
      '<pattern id="p-wainscot" width="' + tile + '" height="' + tile + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-wainscot" width="' + tile + '" height="' + tile + '"/></pattern>' +
      /* Two board variants staggered over a 2x2 cell, so a wide floor does not
         show an obvious repeat every sixteen pixels. */
      '<pattern id="p-floor" width="' + (tile * 2) + '" height="' + (tile * 2) + '" patternUnits="userSpaceOnUse">' +
        '<use href="#t-floor_a" x="0" y="0" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_b" x="' + tile + '" y="0" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_b" x="0" y="' + tile + '" width="' + tile + '" height="' + tile + '"/>' +
        '<use href="#t-floor_a" x="' + tile + '" y="' + tile + '" width="' + tile + '" height="' + tile + '"/>' +
      '</pattern>' +
      /* The hearth light. Its reach is driven by the ledger, never by a clock or
         a timer — see warmth(). It only ever adds light; there is no state in
         which the room gets darker than it was. */
      '<radialGradient id="g-hearth" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#ff9d4d" stop-opacity=".30"/>' +
        '<stop offset="45%" stop-color="#ff9d4d" stop-opacity=".10"/>' +
        '<stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>' +
      '</radialGradient>' +
      /* Corners fall away slightly. Pure decoration, and it is what stops a flat
         tiled field from reading as wallpaper instead of a room. */
      '<radialGradient id="g-vignette" cx="50%" cy="46%" r="75%">' +
        '<stop offset="66%" stop-color="#000000" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#000000" stop-opacity=".26"/>' +
      '</radialGradient>';
  }

  /* ---- warmth ----------------------------------------------------------
     Lifted from index.html's hearth, and the same rules apply: it rises with
     recent activity and settles toward a FLOOR that rises permanently with
     total XP. It never reaches zero, so the worst the room ever looks after
     months of use is better than the best it looked in week one. It is not a
     currency, it buys nothing, and it gates nothing. */
  function warmth(events, totals) {
    var now = Date.now(), recent = 0;
    events.forEach(function (e) {
      if (!e.ts) return;
      var age = (now - new Date(e.ts).getTime()) / 86400000;
      if (age >= 0 && age < 3) recent += (1 - age / 3);
    });
    var floor = Math.min(0.42, Math.log10(1 + (totals["core:xp"] || 0) / 100) * 0.30);
    return Math.max(floor, Math.min(1, floor + recent / 7));
  }

  /* ---- the room drawing ------------------------------------------------- */
  function el(name, attrs) {
    var n = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  /* ---- YOU, IN THE ROOM -------------------------------------------------
   *
   * The room stopped being a picture of a place and became a place, which is
   * the whole difference between an app with an illustration and a game.
   *
   * Three pieces and no more: a body that occupies a tile, movement that
   * respects what is already in the room, and LOOKING — stand in front of a
   * thing, look at it, get a sentence about it. That last one is the point.
   * Walking around an empty room is a tech demo; walking around a room that
   * says something back is a game, and it is what the writing in shop.json's
   * `examine` fields exists for.
   *
   * Deliberately NOT here: pathfinding (one step per input reads better at
   * this size and cannot strand you), diagonal movement, animation smoothing
   * between tiles, and any notion of time passing. Nothing in this room ticks.
   */
  var TILE_MS = 130;                 // how long a step takes to read as a step
  var you = null;                    // {x, y, dir, frame, moving}
  var blocked = null;                // Set of "x,y" occupied by furniture
  var dialogue = null;               // the line currently on screen, or null

  var DIRS = {
    up:    [0, -1], down:  [0, 1],
    left:  [-1, 0], right: [1, 0]
  };

  /* Where you stand when the room first opens: on the floor, in front of the
   * hearth, facing it. You arrive looking at the one thing that was always
   * here. */
  function spawnYou() {
    var room = SHOP.room;
    var fire = (room.fixtures || [])[0];
    var x = fire ? fire.cell[0] + Math.floor(fire.size[0] / 2) : Math.floor(room.cols / 2);
    var y = room.rows - 2;
    you = { x: x, y: y, dir: "up", frame: 0, moving: false };
    if (isBlocked(x, y)) {            // something was bought into the spawn
      var free = firstFreeFloorCell();
      if (free) { you.x = free[0]; you.y = free[1]; }
    }
  }

  function firstFreeFloorCell() {
    var room = SHOP.room;
    for (var y = room.rows - 1; y >= room.wall_rows; y--) {
      for (var x = 0; x < room.cols; x++) if (!isBlocked(x, y)) return [x, y];
    }
    return null;
  }

  /* What you cannot walk through. Rebuilt from the ledger on every render, so
   * buying a wardrobe makes the wardrobe solid immediately and without anyone
   * having to remember to update a second list. Rugs and mats are on the floor
   * LAYER and you walk over them, which is what a rug is for. */
  function rebuildBlocked(events) {
    blocked = Object.create(null);
    S.placed(events, SHOP).forEach(function (p) {
      var it = p.item;
      if (it.layer === "rug") return;            // walk on it
      if (it.layer === "wall") return;           // it is not on the floor
      var c = it.cell, s = it.size || [1, 1];
      for (var x = c[0]; x < c[0] + s[0]; x++) {
        for (var y = c[1]; y < c[1] + s[1]; y++) blocked[x + "," + y] = it;
      }
    });
  }

  function isBlocked(x, y) {
    var room = SHOP.room;
    if (x < 0 || y < 0 || x >= room.cols || y >= room.rows) return true;
    if (y < room.wall_rows) return true;         // the wall is not floor
    return !!blocked[x + "," + y];
  }

  /* What you are facing, whether or not you can walk into it. Wall items are
   * looked at from the floor tile directly below them, which is why this
   * checks the wall band separately rather than treating it as out of bounds. */
  function facing() {
    var d = DIRS[you.dir], tx = you.x + d[0], ty = you.y + d[1];
    var hit = blocked[tx + "," + ty];
    if (hit) return { kind: "item", item: hit };

    var room = SHOP.room;
    if (ty < room.wall_rows) {
      /* Looking at the wall: find a wall-layer item whose footprint covers the
       * column you are facing, at any height. You look UP at a picture; you do
       * not have to be level with it. */
      var owned = S.placed(L.read(), SHOP).filter(function (p) {
        return p.item.layer === "wall";
      });
      for (var i = 0; i < owned.length; i++) {
        var it = owned[i].item, c = it.cell, s = it.size || [1, 1];
        if (tx >= c[0] && tx < c[0] + s[0]) return { kind: "item", item: it };
      }
      return { kind: "wall" };
    }
    if (tx < 0 || tx >= room.cols || ty >= room.rows) return { kind: "nothing" };
    return { kind: "floor" };
  }

  function look() {
    if (dialogue) { dialogue = null; render(); return; }   // tap again to close
    var f = facing();
    var amb = (SHOP.room.ambient || {});
    if (f.kind === "item") {
      dialogue = { title: f.item.label || null, text: f.item.examine || amb.nothing || "" };
    } else {
      dialogue = { title: null, text: amb[f.kind] || amb.nothing || "" };
    }
    render();
  }

  function step(dir) {
    if (!you || you.moving) return;
    if (dialogue) { dialogue = null; }        // moving dismisses the box
    /* Turning is free and does not cost a step. Facing a wall to look at the
     * picture on it should not require walking into the wall first. */
    if (you.dir !== dir) { you.dir = dir; render(); }
    var d = DIRS[dir], nx = you.x + d[0], ny = you.y + d[1];
    if (isBlocked(nx, ny)) { render(); return; }
    you.x = nx; you.y = ny;
    you.frame = you.frame ? 0 : 1;
    you.moving = true;
    render();
    setTimeout(function () { you.moving = false; }, TILE_MS);
  }

  function drawYou(g, tile) {
    if (!you) return;
    var side = you.dir === "left" || you.dir === "right";
    var name = side ? "you_side_" : (you.dir === "up" ? "you_up_" : "you_down_");
    name += (you.frame ? "b" : "a");

    /* A contact shadow, same as the furniture gets. Without one you hover. */
    g.appendChild(el("ellipse", {
      cx: (you.x + 0.5) * tile, cy: (you.y + 1) * tile - 2,
      rx: tile * 0.30, ry: tile * 0.15,
      fill: "#000000", "fill-opacity": ".28"
    }));

    var u = el("use", {
      href: "#t-" + name,
      x: you.x * tile, y: you.y * tile,
      width: tile, height: tile
    });
    /* Left is right, mirrored about the tile's own centre. One sprite, two
       directions, and they can never drift apart. */
    if (you.dir === "left") {
      u.setAttribute("transform",
        "translate(" + ((you.x * 2 + 1) * tile) + ",0) scale(-1,1)");
      u.setAttribute("x", 0);
      u.setAttribute("y", you.y * tile);
    }
    g.appendChild(u);
  }

  /* The dialogue box, drawn INSIDE the room's viewBox so it scales with the
     room instead of floating over it in CSS pixels. Same frame language as the
     menus: outline, gold bevel, dark fill. */
  function drawDialogue(g, W, H, tile) {
    if (!dialogue) return;
    var boxH = tile * 3.2, y = H - boxH - tile * 0.4, x = tile * 0.4;
    var w = W - tile * 0.8;
    g.appendChild(el("rect", { x:x, y:y, width:w, height:boxH, fill:"#241a2e",
      stroke:"#2d1b33", "stroke-width":3 }));
    g.appendChild(el("rect", { x:x+2.5, y:y+2.5, width:w-5, height:boxH-5,
      fill:"none", stroke:"#f5c542", "stroke-width":2 }));

    var lines = wrapText(dialogue.text, 46);
    var ty = y + tile * 0.85;
    if (dialogue.title) {
      var t = el("text", { x:x+tile*0.5, y:ty, fill:"#f5c542",
        "font-family":"ui-rounded,system-ui,sans-serif", "font-size":tile*0.52,
        "font-weight":"700" });
      t.textContent = dialogue.title;
      g.appendChild(t);
      ty += tile * 0.62;
    }
    lines.slice(0, 3).forEach(function (line) {
      var t = el("text", { x:x+tile*0.5, y:ty, fill:"#f6ecdc",
        "font-family":"ui-rounded,system-ui,sans-serif", "font-size":tile*0.46 });
      t.textContent = line;
      g.appendChild(t);
      ty += tile * 0.58;
    });
  }

  function wrapText(s, per) {
    var words = String(s || "").split(/\s+/), out = [], line = "";
    words.forEach(function (word) {
      if ((line + " " + word).trim().length > per) { out.push(line.trim()); line = word; }
      else line = (line + " " + word).trim();
    });
    if (line) out.push(line);
    return out;
  }

  /* Input. Keyboard for the desktop, and TAP-TO-STEP for the phone, which is
     where this actually gets used — you tap a tile and take one step toward
     it, or tap what you are already facing to look at it. No virtual d-pad:
     a d-pad on a touchscreen is a small target you cannot feel, and this room
     is sixteen tiles wide. */
  function bindControls() {
    document.addEventListener("keydown", function (e) {
      var k = e.key;
      var map = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
                  w:"up", s:"down", a:"left", d:"right",
                  W:"up", S:"down", A:"left", D:"right" };
      if (map[k]) { e.preventDefault(); step(map[k]); return; }
      if (k === " " || k === "Enter") { e.preventDefault(); look(); }
    });

    $("roomsvg").addEventListener("click", function (e) {
      if (!you) return;
      var svg = $("roomsvg"), r = svg.getBoundingClientRect();
      var room = SHOP.room, tile = room.tile;
      var scale = r.width / (room.cols * tile);
      var cx = Math.floor((e.clientX - r.left) / scale / tile);
      var cy = Math.floor((e.clientY - r.top) / scale / tile);
      if (dialogue) { dialogue = null; render(); return; }

      var dx = cx - you.x, dy = cy - you.y;
      if (dx === 0 && dy === 0) { look(); return; }
      /* Tapping the tile you already face means "look at it". Tapping anywhere
         else means "take one step that way". */
      var d = DIRS[you.dir];
      if (dx === d[0] && dy === d[1]) { look(); return; }
      if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? "right" : "left");
      else step(dy > 0 ? "down" : "up");
    });
  }

  function drawRoom(events, totals) {
    var room = SHOP.room, tile = room.tile;
    var W = room.cols * tile, H = room.rows * tile;
    var wallH = room.wainscot_row * tile;          // plaster band
    var floorY = room.wall_rows * tile;

    var svg = $("roomsvg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var g = $("scene");
    while (g.firstChild) g.removeChild(g.firstChild);

    g.appendChild(el("rect", { x:0, y:0, width:W, height:wallH, fill:"url(#p-wall)" }));
    g.appendChild(el("rect", { x:0, y:wallH, width:W, height:tile, fill:"url(#p-wainscot)" }));
    g.appendChild(el("rect", { x:0, y:floorY, width:W, height:H - floorY, fill:"url(#p-floor)" }));

    /* Empty floor cells, faintly. "There is room for more", never "you have
       nothing" — the same reason a locked item stays visible in the shop. */
    S.vacantCells(events, SHOP).forEach(function (v) {
      g.appendChild(el("rect", {
        x: v.cell[0] * tile + 2, y: v.cell[1] * tile + 2,
        width: v.size[0] * tile - 4, height: v.size[1] * tile - 4,
        rx: 3, "class": "vacant"
      }));
    });

    /* Already in draw order: rugs, then wall, then floor back-to-front. */
    rebuildBlocked(events);
    if (!you) spawnYou();
    var here = S.placed(events, SHOP);
    here.forEach(function (p) {
      var it = p.item, c = it.cell, s = it.size;
      if (it.layer === "floor") {
        /* A soft contact shadow. Without one, furniture floats and the room
           reads as a sticker sheet rather than as a place. */
        g.appendChild(el("ellipse", {
          cx: (c[0] + s[0] / 2) * tile, cy: (c[1] + s[1]) * tile - 2,
          rx: s[0] * tile * 0.40, ry: tile * 0.17,
          fill: "#000000", "fill-opacity": ".22"
        }));
      }
      var u = el("use", {
        href: "#t-" + it.sprite,
        x: c[0] * tile, y: c[1] * tile,
        width: s[0] * tile, height: s[1] * tile
      });
      var title = document.createElementNS(NS, "title");
      title.textContent = it.label || it.id;
      u.appendChild(title);
      g.appendChild(u);
    });

    /* A retracted mis-tap never happened, so it must not warm the hearth
       (ADR-027) — same reasoning as index.html's log list. */
    var w = warmth(L.visibleEvents(events), totals);
    var fire = (room.fixtures || [])[0];
    if (fire) {
      var fx = (fire.cell[0] + fire.size[0] / 2) * tile;
      var fy = (fire.cell[1] + fire.size[1] / 2) * tile;
      var reach = tile * (4 + w * 6);
      g.appendChild(el("ellipse", {
        cx: fx, cy: fy, rx: reach, ry: reach * 0.72,
        fill: "url(#g-hearth)", opacity: (0.30 + w * 0.55).toFixed(3),
        "pointer-events": "none"
      }));
    }
    drawYou(g, tile);
    g.appendChild(el("rect", {
      x:0, y:0, width:W, height:H, fill:"url(#g-vignette)", "pointer-events":"none"
    }));
    drawDialogue(g, W, H, tile);

    var built = here.filter(function (p) { return !p.fixture; }).length;
    /* The one instruction the room gets. It has to be here rather than in a
       help screen nobody opens, and it has to be short enough to read once. */
    var howto = "<b>Tap to walk</b> &middot; tap what you're facing to look at it";
    $("roomline").innerHTML = (built === 0
      ? "The hearth is lit and the room is otherwise bare. Everything here is bought with Embers you already earned."
      : built === 1
        ? "The hearth, and one thing you built."
        : "The hearth, and " + built + " things you built.") +
      "<br>" + howto;
    return built;
  }

  /* ---- buying ----------------------------------------------------------
     TWO TAPS, ALWAYS. Nothing built is ever taken back (§4 rule 2), which is a
     kindness in every case except one: a mis-tap that spends three weeks of
     Embers cannot be undone by the retraction mechanism either, because
     retraction corrects *what you did*, not what you chose to buy. So the
     confirmation is the only guard this action gets, and it is not optional.
     It disarms itself after a few seconds so it never sits waiting to be
     brushed. */
  function arm(item, btn) {
    if (arming === item.id) { commit(item); return; }
    disarm();
    arming = item.id;
    btn.classList.add("confirm");
    btn.textContent = "buy for " + item.cost["core:embers"].toLocaleString() + "?";
    armTimer = setTimeout(function () { disarm(); render(); }, 4500);
  }
  function disarm() {
    arming = null;
    if (armTimer) { clearTimeout(armTimer); armTimer = null; }
  }
  function commit(item) {
    disarm();
    var events = L.read();
    var verdict = S.canBuy(events, item, { ledger: L, character: C });
    if (!verdict.ok) { render(); return; }   // re-checked against the ledger, not the UI
    var ev = S.buyEvent(L, item);
    var errs = L.validate(ev, IDS);
    if (errs.length) { alert("Not bought — " + errs.join("; ")); return; }
    L.appendAndSave(ev, IDS);
    render();
  }

  /* ---- render ----------------------------------------------------------- */
  function render() {
    var events = L.read();
    var totals = L.balances(events);
    var rows = S.view(events, SHOP, { ledger: L, character: C });
    var have = Math.round(totals["core:embers"] || 0);

    $("roomtitle").textContent = SHOP.room.label;
    $("embers").textContent = have.toLocaleString();
    $("ownedn").textContent = rows.filter(function (r) { return r.owned; }).length;
    $("roomsub").textContent = "yours, and nothing in it can ever be taken back";

    drawRoom(events, totals);

    var wrap = $("shop"); wrap.innerHTML = "";
    ORDER.forEach(function (skill) {
      var mine = rows.filter(function (r) { return r.item.skill === skill; });
      if (!mine.length) return;
      var owned = mine.filter(function (r) { return r.owned; }).length;
      var h = document.createElement("h2");
      h.textContent = SKILL_LABEL[skill] + " · level " + mine[0].level +
                      " · " + owned + " of " + mine.length;
      wrap.appendChild(h);
      var list = document.createElement("div"); list.className = "items";
      mine.forEach(function (r) { list.appendChild(rowFor(r)); });
      wrap.appendChild(list);
    });

    var unknown = L.countUnknownKinds(events);
    $("foot").innerHTML =
      "What you own is worked out from your own spend events — there is no separate " +
      "list of your things anywhere, so an export carries the whole room with it." +
      (unknown ? "<br>" + unknown + " event(s) were written by a newer version and are kept untouched." : "") +
      "<br>Schema v" + L.SCHEMA_VERSION + " &middot; " + L.SOURCE;
  }

  function rowFor(r) {
    var el2 = document.createElement("div");
    el2.className = "row" + (r.owned ? " owned" : r.unlocked ? "" : " locked");

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "thumb");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.appendChild(el("use", { href: "#t-" + r.item.sprite, width: 16, height: 16 }));
    el2.appendChild(svg);

    var mid = document.createElement("div");
    var why = r.owned ? "yours"
      : !r.unlocked ? SKILL_LABEL[r.item.skill] + " level " + r.item.unlock_level + " unlocks it"
      : !r.affordable ? r.shortBy.toLocaleString() + " more Embers"
      : "";
    mid.innerHTML = '<div class="name">' + esc(r.item.label) + '</div>' +
                    '<div class="blurb">' + esc(r.item.blurb || "") + '</div>' +
                    (why ? '<div class="why">' + esc(why) + '</div>' : '');
    el2.appendChild(mid);

    var right = document.createElement("div");
    var b = document.createElement("button");
    b.className = "buy" + (r.can.ok ? " ready" : "");
    b.type = "button";
    if (r.owned) { b.textContent = "built"; b.disabled = true; }
    else {
      b.textContent = r.item.cost["core:embers"].toLocaleString() + " ◆";
      b.disabled = !r.can.ok;
      if (r.can.ok) b.addEventListener("click", function () { arm(r.item, b); });
    }
    right.appendChild(b);
    el2.appendChild(right);
    return el2;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
